name: Deploy to Production

on:
  push:
    branches: [gcm-beta]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare SSH key
      
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

        env:
          EC2_KEY: ${{ secrets.GCM_KEY }}

      - name: Pause service on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem \
            ${{ secrets.GCM_USER }}@${{ secrets.GCM_HOST }} << 'EOF'
              sudo systemctl stop ${{ secrets.GCM_SERVICE_NAME }}
          EOF

      - name: Copy source code to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ec2_key.pem" \
            ./OrdrMate/ ${{ secrets.GCM_USER }}@${{ secrets.GCM_HOST }}:~/app

      - name: Build on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem \
            ${{ secrets.GCM_USER }}@${{ secrets.GCM_HOST }} << 'EOF'
              cd ~/app
              dotnet restore
              dotnet publish -c Debug -o publish
          EOF

      - name: Apply Migrations on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem \
            ${{ secrets.GCM_USER }}@${{ secrets.GCM_HOST }} << 'EOF'
              cd ~/app
              dotnet ef database update
          EOF

      - name: Restart Service on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem \
            ${{ secrets.GCM_USER }}@${{ secrets.GCM_HOST }} << 'EOF'
              sudo systemctl start ${{ secrets.GCM_SERVICE_NAME }}
          EOF